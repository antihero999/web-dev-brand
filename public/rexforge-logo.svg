<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Rich 3D Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#FCD366" />
      <stop offset="60%" stop-color="#D99B26" />
      <stop offset="100%" stop-color="#8C580B" />
    </linearGradient>
    
    <linearGradient id="goldDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAD058" />
      <stop offset="50%" stop-color="#B87B14" />
      <stop offset="100%" stop-color="#5E3B04" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFE89E" />
      <stop offset="45%" stop-color="#E5AA33" />
      <stop offset="55%" stop-color="#9E680E" />
      <stop offset="100%" stop-color="#D49622" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Top Crown / Spear Structure -->
    <!-- Center Spear/Arrow Peak -->
    <path d="M 200 40 L 222 95 L 210 95 L 210 130 L 190 130 L 190 95 L 178 95 Z" fill="url(#goldLight)" />
    <!-- Left Crown Wing -->
    <path d="M 190 115 L 140 70 L 160 130 L 190 130 Z" fill="url(#goldDark)" />
    <path d="M 140 70 L 100 110 L 135 145 L 160 130 Z" fill="url(#goldLight)" />
    <!-- Right Crown Wing -->
    <path d="M 210 115 L 260 70 L 240 130 L 210 130 Z" fill="url(#goldLight)" />
    <path d="M 260 70 L 300 110 L 265 145 L 240 130 Z" fill="url(#goldDark)" />

    <!-- Crown Base Band -->
    <path d="M 108 140 L 200 155 L 292 140 L 285 158 L 200 172 L 115 158 Z" fill="url(#goldBevel)" />

    <!-- Main Shield Outline & Wings -->
    <path d="M 115 170 Q 110 240 135 295 Q 165 345 200 375 Q 235 345 265 295 Q 290 240 285 170 L 265 175 Q 268 230 250 275 Q 225 315 200 345 Q 175 315 150 275 Q 132 230 135 175 Z" fill="url(#goldBevel)" />

    <!-- Lower Feathered/Flame Wing Flairs -->
    <path d="M 130 280 Q 110 320 150 350 Q 175 370 200 395 Q 225 370 250 350 Q 290 320 270 280 Q 255 315 235 335 Q 200 365 200 365 Q 200 365 165 335 Q 145 315 130 280 Z" fill="url(#goldLight)" />
    <path d="M 160 335 Q 180 370 200 410 Q 220 370 240 335 Q 220 355 200 375 Q 180 355 160 335 Z" fill="url(#goldBevel)" />

    <!-- Shield Inner Cavity / Dark Plate Background -->
    <path d="M 136 178 L 200 188 L 264 178 Q 268 230 248 270 Q 225 310 200 338 Q 175 310 152 270 Q 132 230 136 178 Z" fill="#0C0A08" stroke="url(#goldDark)" stroke-width="2" />

    <!-- Central Sculpted Golden 'R' -->
    <!-- R Left Vertical Stem -->
    <path d="M 162 205 L 184 205 L 184 295 L 162 295 Z" fill="url(#goldLight)" />
    <!-- R Upper Loop Outer -->
    <path d="M 180 205 L 225 205 Q 248 205 248 228 Q 248 248 225 248 L 180 248 Z" fill="url(#goldBevel)" />
    <!-- R Upper Loop Inner Cutout -->
    <path d="M 184 218 L 220 218 Q 232 218 232 228 Q 232 236 220 236 L 184 236 Z" fill="#0C0A08" />
    <!-- R Dynamic Angular Leg -->
    <path d="M 205 245 L 246 295 L 222 295 L 188 250 Z" fill="url(#goldLight)" />
    <!-- R Stylized Serif Cutout Accent -->
    <path d="M 152 205 L 162 205 L 162 218 Z" fill="url(#goldLight)" />
    <path d="M 246 295 L 255 295 L 246 284 Z" fill="url(#goldLight)" />
  </g>
</svg>
